name: Build

# Produces aria2c for Windows and for iOS from the same patched source tree.
#
# The patches are the reason this fork exists, so every job runs the same
# scripts/fetch-and-patch.sh rather than applying them inline. A job that
# silently skipped one would still produce a working binary that behaves
# differently from the others, which is the failure mode worth designing out.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  # `contents: write` is needed to attach the built binaries to a release.
  # Artifacts and release assets are governed by separate quotas: the artifact
  # store is small and shared across the account, and it filled up after the
  # first successful Windows build. The release assets are what the app is
  # actually going to consume, so they are attached there and the artifact
  # upload is treated as best effort.
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Windows: cross-compiled with mingw-w64 on Linux
  #
  # Cross-compiling on Linux rather than building natively under MSYS2. That is
  # what the source tree's own Dockerfile.mingw does, and it keeps the Windows
  # job structurally identical to the iOS one: both are a toolchain plus the
  # same shell scripts.
  # ---------------------------------------------------------------------------
  windows:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            host: x86_64-w64-mingw32
            triple: x86_64-w64-mingw32
            pkg: gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          - arch: x86
            host: i686-w64-mingw32
            triple: i686-w64-mingw32
            pkg: gcc-mingw-w64-i686 g++-mingw-w64-i686

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates patch \
            autoconf automake libtool pkg-config dpkg-dev \
            xz-utils lzip bzip2 \
            ${{ matrix.pkg }}

      - name: Build
        env:
          HOST: ${{ matrix.host }}
        # Invoked through bash rather than by path: the executable bit is
        # not reliably preserved through a checkout on every platform.
        run: bash platform/windows/build.sh

      - name: Verify
        run: |
          set -euo pipefail
          EXE=build/windows/${{ matrix.arch }}/aria2c.exe
          file "$EXE"
          # A PE binary for the right machine. A Linux ELF here would mean the
          # cross-compiler was not picked up, which links fine and fails only
          # when a user runs it.
          file "$EXE" | grep -q 'PE32'
          case "${{ matrix.arch }}" in
            x64) file "$EXE" | grep -q 'x86-64' ;;
            x86) file "$EXE" | grep -q 'Intel 80386' ;;
          esac

          # The Turbo patches have to be visible in the binary, not just in the
          # source. --help is generated from the option table, so a missing
          # patch shows up as a missing line here.
          strings "$EXE" | grep -q 'max-connection-per-server'
          strings "$EXE" | grep -q 'retry-on-400'

          # That is as far as this job can go. It runs on ubuntu-22.04 -- the
          # build is a mingw cross-compile -- so there is nothing here that can
          # execute a PE binary:
          #
          #     run-detectors: unable to find an interpreter for aria2c.exe
          #
          # Starting the binary is what would catch an option value it refuses,
          # which is how --max-connection-per-server=-1 went unnoticed here, and
          # it cannot be done from this runner without a Wine setup that would
          # be a second thing to keep working. It is done in the repository that
          # consumes these binaries instead: its test suite runs the real
          # aria2c, downloads a file over a loopback socket, and compares the
          # bytes. See AmorCool/ThunderX-Rebuild.

      - name: Stage
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/windows/${{ matrix.arch }}/aria2c.exe \
             dist/win-${{ matrix.arch }}.exe

      # Best effort. When the account's artifact quota is exhausted this step
      # fails the job even though the binary is fine, so it must not be allowed
      # to decide the outcome -- the release step below is the real delivery.
      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bin-win-${{ matrix.arch }}
          path: dist/win-${{ matrix.arch }}.exe
          if-no-files-found: warn

      - name: Attach to release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${{ github.run_number }}-${{ matrix.arch }}"
          # The title and notes are deliberately bare.
          #
          # Release metadata is indexed and searchable, and it outlives the
          # repository's visibility setting: whatever is written here is
          # readable the moment the repository is public, and stays in the
          # release list afterwards. Nothing here names what the binaries are
          # or what they were built from.
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Build ${{ github.run_number }}." \
            || true
          gh release upload "$tag" dist/win-${{ matrix.arch }}.exe --clobber

  # ---------------------------------------------------------------------------
  # iOS: Xcode toolchain, device + simulator
  #
  # Needs macOS. The runner label is a parameter rather than a hardcoded
  # name, because the Xcode version this project targets is not the one on
  # the standard hosted image.
  # ---------------------------------------------------------------------------
  ios:
    runs-on: ${{ vars.IOS_RUNNER || 'macos-14' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: iphoneos
            name: device
          - sdk: iphonesimulator
            name: simulator

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos clang --version

      - name: Install build tooling
        run: brew install autoconf automake libtool pkg-config || true

      - name: Build
        run: |
          set -o pipefail
          # Same reason as the Windows job: call it through bash rather than
          # relying on the executable bit.
          bash platform/ios/build.sh ${{ matrix.sdk }} 2>&1 | tee build-${{ matrix.name }}.log

      - name: Report errors
        if: failure()
        run: |
          grep -iE 'error:|fatal error|configure: error' build-${{ matrix.name }}.log \
            | head -40 || true

      - name: Verify
        run: |
          set -euo pipefail
          OUT=build/ios/${{ matrix.sdk }}
          file "$OUT/aria2c"
          # A Mach-O for the right platform is the thing worth asserting: a
          # macOS binary would run on the build machine and fail on device,
          # and the failure would surface much later as a launch error.
          file "$OUT/aria2c" | grep -q 'Mach-O'
          file "$OUT/aria2c" | grep -q 'arm64'
          lipo -info "$OUT/aria2c" || true
          test -s "$OUT/libaria2.a"

          # The binary is dumped to a file once and searched there, rather than
          # streamed into `grep -q`.
          #
          # Xcode ships LLVM's strings, not GNU's, and it does not tolerate a
          # reader that stops early:
          #
          #     error: .../XcodeDefault.xctoolchain/usr/bin/strings: failed to
          #         flush output
          #
          # `grep -q` exits the moment it matches, which closes the pipe, which
          # makes strings report that and exit non-zero -- and under
          # `set -o pipefail` that fails the step even though the match was
          # found. GNU strings on the Windows job ignores the same condition,
          # which is why this only ever broke here. Reading from a file means
          # the reader always reaches end of input.
          strings "$OUT/aria2c" > "$OUT/aria2c.strings"
          grep -q 'max-connection-per-server' "$OUT/aria2c.strings"
          grep -q 'retry-on-400' "$OUT/aria2c.strings"

      - name: Stage
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/ios/${{ matrix.sdk }}/aria2c dist/ios-${{ matrix.name }}
          cp build/ios/${{ matrix.sdk }}/libaria2.a dist/lib-ios-${{ matrix.name }}.a

      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: bin-ios-${{ matrix.name }}
          path: |
            dist/ios-${{ matrix.name }}
            dist/lib-ios-${{ matrix.name }}.a
            build-${{ matrix.name }}.log
          if-no-files-found: warn

      - name: Attach to release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="build-${{ github.run_number }}-${{ matrix.name }}"
          # The title and notes are deliberately bare.
          #
          # Release metadata is indexed and searchable, and it outlives the
          # repository's visibility setting: whatever is written here is
          # readable the moment the repository is public, and stays in the
          # release list afterwards. Nothing here names what the binaries are
          # or what they were built from.
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "Build ${{ github.run_number }}." \
            || true
          gh release upload "$tag" \
            dist/ios-${{ matrix.name }} \
            dist/lib-ios-${{ matrix.name }}.a \
            --clobber
